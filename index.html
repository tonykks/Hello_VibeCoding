<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello VibeCoding</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="card-header">
        <h1>Hello VibeCoding</h1>
        <button id="themeToggleBtn" type="button" aria-label="다크모드 전환">Dark Mode</button>
      </div>

      <p class="description">이름을 입력하고 버튼을 눌러 인사말을 바꿔보세요.</p>

      <p id="greetingText" class="greeting">안녕하세요!</p>

      <div class="input-row">
        <label for="nameInput" class="sr-only">이름 입력</label>
        <input id="nameInput" type="text" placeholder="이름을 입력하세요">
        <button id="greetBtn" type="button">인사하기</button>
      </div>

      <div class="time-box">
        <span class="time-label">현재 시간</span>
        <strong id="clockText" aria-live="polite"></strong>
      </div>

      <div class="goal-box">
        <label for="goalInput">오늘의 목표</label>
        <input id="goalInput" type="text" placeholder="예: 30분 이상 코딩하기">
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEYS = {
      goal: "vibecoding_goal",
      theme: "vibecoding_theme"
    };

    const greetingText = document.getElementById("greetingText");
    const nameInput = document.getElementById("nameInput");
    const greetBtn = document.getElementById("greetBtn");
    const clockText = document.getElementById("clockText");
    const goalInput = document.getElementById("goalInput");
    const themeToggleBtn = document.getElementById("themeToggleBtn");

    function updateGreeting() {
      const name = nameInput.value.trim();
      greetingText.textContent = name ? `안녕하세요, ${name}님!` : "안녕하세요!";
    }

    function updateClock() {
      const now = new Date();
      clockText.textContent = now.toLocaleTimeString("ko-KR", { hour12: false });
    }

    function applyTheme(theme) {
      const isDark = theme === "dark";
      document.body.classList.toggle("dark", isDark);
      themeToggleBtn.textContent = isDark ? "Light Mode" : "Dark Mode";
    }

    greetBtn.addEventListener("click", updateGreeting);
    nameInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        updateGreeting();
      }
    });

    goalInput.addEventListener("input", () => {
      localStorage.setItem(STORAGE_KEYS.goal, goalInput.value);
    });

    themeToggleBtn.addEventListener("click", () => {
      const nextTheme = document.body.classList.contains("dark") ? "light" : "dark";
      applyTheme(nextTheme);
      localStorage.setItem(STORAGE_KEYS.theme, nextTheme);
    });

    const savedGoal = localStorage.getItem(STORAGE_KEYS.goal);
    if (savedGoal !== null) {
      goalInput.value = savedGoal;
    }

    const savedTheme = localStorage.getItem(STORAGE_KEYS.theme) || "light";
    applyTheme(savedTheme);

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
